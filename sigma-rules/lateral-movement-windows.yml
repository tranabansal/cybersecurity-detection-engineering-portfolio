title: Suspicious Lateral Movement Activity

id: 44444444-4444-4444-4444-444444444444

status: experimental

description: Detects potential lateral movement using remote execution tools or administrative shares.

author: yourname

date: 2026-05-27

references:
  - https://attack.mitre.org/techniques/T1021/

logsource:
  category: process_creation
  product: windows

detection:

  selection:
    CommandLine|contains:
      - 'psexec'
      - 'wmic'
      - 'Invoke-WmiMethod'
      - 'sc.exe'
      - '\\admin$'
      - '\\c$'

  condition: selection

fields:
  - CommandLine
  - Image
  - ParentImage
  - User

falsepositives:
  - Legitimate administrative activity
  - IT remote management tools
  - Software deployment systems

level: high

tags:
  - attack.lateral_movement
  - attack.t1021
