title: Multiple Failed Login Attempts (Possible Brute Force)

id: 22222222-2222-2222-2222-222222222222

status: experimental

description: Detects repeated failed Windows login attempts that may indicate a brute force attack.

author: yourname

date: 2026-05-27

references:
  - https://attack.mitre.org/techniques/T1110/

logsource:
  product: windows
  service: security

detection:

  selection:
    EventID: 4625

  timeframe: 5m

  condition: selection | count() by TargetUserName > 10

fields:
  - TargetUserName
  - IpAddress
  - WorkstationName
  - LogonType

falsepositives:
  - User entering incorrect password multiple times
  - Misconfigured services generating authentication failures

level: high

tags:
  - attack.credential_access
  - attack.t1110
